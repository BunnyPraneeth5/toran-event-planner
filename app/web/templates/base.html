<!doctype html>
<html lang="{{ lang | default('en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Toran: an event planner{% endblock %}</title>
  <meta name="description" content="Plan an Indian wedding, birthday or community event: budget, timeline and who pays, checked by tested engines.">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&amp;display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body hx-ext="toran-json">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="wrap">
      <p class="brand"><a href="/">Toran</a></p>
      <p class="tagline">An event planner</p>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <div id="live" class="live" role="status" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Amounts are rough defaults, not vendor quotes. Nothing you type is stored on our server.</p>
    </div>
  </footer>
</body>
</html>
