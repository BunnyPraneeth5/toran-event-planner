{# The plan travels back to the browser here; static JS saves it to localStorage. It is an
   attribute, not a <script> block, because htmx (allowScriptTags: false) strips every script
   tag from swapped content. Jinja autoescape makes the JSON safe inside the attribute. #}
<div id="plan-state" hidden data-plan="{{ plan.model_dump_json() }}"></div>
