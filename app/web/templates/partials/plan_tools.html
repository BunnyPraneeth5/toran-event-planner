<section class="card" aria-labelledby="tools-heading">
  <h3 id="tools-heading">Keep your plan</h3>
  <p>Your plan is saved in this browser only. Download the file to keep a copy or open it on another device.</p>
  <div class="actions">
    <button type="button" class="secondary" data-action="export-plan">Download plan file</button>
  </div>
  <div class="field">
    <label for="import-plan">Open a plan file</label>
    <input id="import-plan" type="file" accept="application/json,.json" data-action="import-plan">
  </div>
</section>
