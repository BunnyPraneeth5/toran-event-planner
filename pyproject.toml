[project]
name = "toran-event-planner"
version = "0.1.0"
description = "Toran, an event planner for Indian weddings, birthdays and community events."
requires-python = ">=3.12"
# Same pins as requirements.txt (Vercel installs from this file); a test keeps them in sync.
dependencies = [
    "fastapi==0.162.0",
    "google-genai==2.33.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "slowapi==0.1.10",
    "uvicorn==0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
